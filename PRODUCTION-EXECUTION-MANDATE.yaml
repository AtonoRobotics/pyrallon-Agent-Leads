  - {id: cognitive_production_routing, completion: implementation_provider_e2e_evidence}
  - {id: connectors_and_webhooks, completion: implementation_provider_e2e_evidence}
  - {id: deployment_and_release_operations, completion: implementation_provider_e2e_evidence}
  - {id: domain_and_workflows, completion: implementation_provider_e2e_evidence}
  - {id: ios_client_and_offline_contract, completion: implementation_provider_e2e_evidence}
  - {id: nurture_and_transaction_operations, completion: implementation_provider_e2e_evidence}
  - {id: operator_api_and_web_ui, completion: implementation_provider_e2e_evidence}
  - {id: postgres_backup_and_restore, completion: implementation_provider_e2e_evidence}
  - {id: provider_ingress_and_senders, completion: implementation_provider_e2e_evidence}
  - {id: security_observability_and_evaluations, completion: implementation_provider_e2e_evidence}
  - {id: temporal_replay_and_recovery, completion: implementation_provider_e2e_evidence}

